<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6ead8">
<title>Elvin's Portfolio</title>
<meta name="description" content="Elvin Esguerra — portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6ead8;
    --bg-2: #fdf4e6;
    --ink: #3b2f26;
    --ink-soft: #6b5b4d;
    --ink-dim: #93806f;
    --line: rgba(92,68,48,0.14);
    --line-2: rgba(92,68,48,0.26);
    --accent: #a8501f;
    --accent-2: #c98a2e;
    --accent-3: #b0603a;
    --card-bg: rgba(255,253,248,0.78);
    --glow: rgba(168,80,31,0.30);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Ambient backdrop */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1200px 680px at 20% 6%, rgba(255,214,150,0.62), transparent 64%),
      radial-gradient(1000px 620px at 84% 94%, rgba(240,176,140,0.42), transparent 66%),
      radial-gradient(760px 520px at 92% 12%, rgba(255,236,196,0.55), transparent 62%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 52%, #f1dfc6 100%);
  }
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, rgba(255,255,255,0.85), transparent 62%),
      radial-gradient(1.3px 1.3px at 34% 62%, rgba(255,248,232,0.70), transparent 62%),
      radial-gradient(1.8px 1.8px at 58% 26%, rgba(255,255,255,0.78), transparent 62%),
      radial-gradient(1.3px 1.3px at 76% 71%, rgba(255,246,226,0.62), transparent 62%),
      radial-gradient(1.7px 1.7px at 89% 34%, rgba(255,255,255,0.72), transparent 62%),
      radial-gradient(1.2px 1.2px at 47% 86%, rgba(255,244,222,0.58), transparent 62%),
      radial-gradient(1.5px 1.5px at 7% 74%, rgba(255,255,255,0.55), transparent 62%),
      radial-gradient(1.3px 1.3px at 66% 9%, rgba(255,250,236,0.60), transparent 62%);
    background-repeat: repeat;
    background-size: 620px 480px;
    opacity: .55;
    animation: twinkle 7s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .40; } 50% { opacity: .68; } }

  /* Shell */
  .stage-wrap {
    position: relative; z-index: 1;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 22px 20px 26px;
    gap: clamp(10px, 2.2vh, 26px);
  }

  /* Title */
  .masthead { text-align: center; flex: 0 0 auto; }
  .masthead h1 {
    margin: 0;
    font-size: clamp(2rem, 6.2vw, 4.4rem);
    line-height: 0.98;
    font-weight: 300;
    letter-spacing: -0.035em;
  }
  .masthead h1 .strong {
    display: block;
    font-weight: 700;
    background: linear-gradient(96deg, var(--accent), var(--accent-3) 46%, var(--accent-2) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .masthead .sub {
    margin: clamp(8px, 1.4vh, 16px) 0 0;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(10px, 1.15vw, 12.5px);
    letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--ink-dim);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .masthead .sub .glyph {
    display: inline-block; width: 18px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .masthead .sub .glyph.r {
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  /* Ring stage */
  .stage {
    flex: 1 1 auto;
    width: 100%;
    max-width: 1240px;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 2000px;
    touch-action: pan-y;
    cursor: grab;
    outline: none;
  }
  .stage.dragging { cursor: grabbing; }
  .stage:focus-visible { outline: none; }
  .stage:focus-visible .ring3d { filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }

  .ring3d {
    position: relative;
    width: 1px; height: 1px;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .card3d {
    position: absolute; left: 0; top: 0;
    transform-style: preserve-3d;
    will-change: transform, opacity;
  }

  .card-face {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--card-bg);
    backdrop-filter: blur(10px) saturate(130%);
    -webkit-backdrop-filter: blur(10px) saturate(130%);
    box-shadow: 0 20px 46px -22px rgba(120,78,44,0.30), 0 2px 8px -3px rgba(120,78,44,0.14);
    display: flex; flex-direction: column; justify-content: flex-end;
    text-decoration: none; color: inherit;
    transition: border-color .5s var(--ease), box-shadow .5s var(--ease);
  }
  .card3d.front .card-face {
    border-color: rgba(168,80,31,0.40);
    box-shadow: 0 28px 62px -24px rgba(120,78,44,0.34), 0 0 44px -14px var(--glow);
  }

  /* Faded imagery layer */
  .card-art {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: saturate(0.72) contrast(1.02);
    opacity: .30;
    transform: scale(1.02);
    transition: opacity .6s var(--ease), transform .8s var(--ease), filter .6s var(--ease);
  }
  .card3d.front .card-art { opacity: .40; filter: saturate(0.95); transform: scale(1.06); }

  .card-art.gen-exp {
    background-image:
      radial-gradient(circle at 30% 22%, rgba(240,158,90,0.62), transparent 56%),
      radial-gradient(circle at 74% 78%, rgba(255,206,130,0.58), transparent 58%),
      repeating-linear-gradient(90deg, rgba(140,92,54,0.07) 0 1px, transparent 1px 7px),
      linear-gradient(160deg, #ffeed6, #fbdcb6);
  }
  .card-art.gen-pets {
    background-image:
      radial-gradient(circle at 68% 26%, rgba(255,196,116,0.66), transparent 56%),
      radial-gradient(circle at 24% 80%, rgba(226,142,110,0.50), transparent 58%),
      repeating-linear-gradient(48deg, rgba(140,92,54,0.06) 0 1px, transparent 1px 9px),
      linear-gradient(160deg, #fff0da, #fbdfc4);
  }

  .card-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(255,253,248,0.96) 0%, rgba(255,252,245,0.80) 36%, rgba(255,252,245,0.24) 74%, transparent 100%);
  }
  .card-hair {
    position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(168,80,31,0.60), transparent);
    opacity: 0; transition: opacity .5s var(--ease);
  }
  .card3d.front .card-hair { opacity: 1; }

  .card-body {
    position: relative;
    padding: var(--pad, 20px);
    display: flex; flex-direction: column; gap: 6px;
  }
  .card-num {
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: var(--fs-num, 10px);
    letter-spacing: 0.24em;
    color: var(--accent);
    opacity: .85;
  }
  .card-title {
    margin: 0;
    font-size: var(--fs-title, 22px);
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .card-note {
    margin: 0;
    font-size: var(--fs-note, 13px);
    line-height: 1.45;
    color: var(--ink-soft);
  }

  /* Controls */
  .controls {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    gap: 18px;
  }
  .navbtn {
    width: 40px; height: 40px; flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line-2);
    background: rgba(255,255,255,0.62);
    color: var(--ink-soft);
    cursor: pointer;
    transition: color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease), transform .3s var(--ease);
  }
  .navbtn svg { width: 16px; height: 16px; }
  .navbtn:hover {
    color: var(--accent); border-color: rgba(168,80,31,0.45);
    background: rgba(168,80,31,0.09); transform: translateY(-1px);
  }
  .navbtn:active { transform: translateY(0) scale(0.96); }

  .pips { display: flex; align-items: center; gap: 9px; }
  .pip {
    width: 7px; height: 7px; padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line-2);
    background: transparent;
    cursor: pointer;
    transition: background .35s var(--ease), border-color .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .pip:hover { border-color: var(--accent); transform: scale(1.2); }
  .pip.on {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(168,80,31,0.15);
    transform: scale(1.15);
  }

  .navbtn:focus-visible, .pip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }

  /* Entrance */
  .fade { opacity: 0; transform: translateY(14px); }
  body.ready .fade {
    opacity: 1; transform: none;
    transition: opacity .9s var(--ease), transform .9s var(--ease);
  }
  body.ready .f1 { transition-delay: .05s; }
  body.ready .f2 { transition-delay: .16s; }
  body.ready .f3 { transition-delay: .30s; }

  @media (max-width: 640px) {
    .stage-wrap { padding: 18px 14px 20px; }
    .masthead .sub { letter-spacing: 0.24em; }
    .controls { gap: 14px; }
    .navbtn { width: 36px; height: 36px; }
  }


  /* ---------------- Clickable card face ---------------- */
  .card-face {
    appearance: none; -webkit-appearance: none;
    font: inherit; color: inherit; text-align: left;
    padding: 0; margin: 0; cursor: pointer;
  }
  .card3d:not(.front) .card-face { cursor: grab; }
  .card-face:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 4px;
  }
  .card-cta {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: calc(var(--pad, 20px) * 0.55);
    font-family: "JetBrains Mono", monospace;
    font-size: var(--fs-num, 10px);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
    opacity: 0; transform: translateY(4px);
    transition: opacity .5s var(--ease), transform .5s var(--ease), gap .3s var(--ease);
  }
  .card3d.front .card-cta { opacity: 1; transform: none; }
  .card-face:hover .card-cta { gap: 12px; }
  .card-cta svg { width: 1.05em; height: 1.05em; }

  /* ---------------- Sheet ---------------- */
  .sheet-wrap {
    position: fixed; inset: 0; z-index: 90;
    display: grid; place-items: center;
    padding: clamp(12px, 3vw, 40px);
  }
  .sheet-wrap[hidden] { display: none; }
  body.locked .stage-wrap { pointer-events: none; }

  .sheet-scrim {
    position: absolute; inset: 0;
    background: rgba(74,52,34,0.42);
    backdrop-filter: blur(7px) saturate(120%);
    -webkit-backdrop-filter: blur(7px) saturate(120%);
    opacity: 0; transition: opacity .42s var(--ease);
  }
  .sheet-wrap.on .sheet-scrim { opacity: 1; }

  .sheet {
    position: relative;
    width: min(860px, 100%);
    max-height: min(88vh, 860px);
    display: flex; flex-direction: column;
    background: linear-gradient(178deg, #fffdf7 0%, #fdf5e8 100%);
    border: 1px solid var(--line-2);
    border-radius: 20px;
    box-shadow: 0 44px 96px -34px rgba(96,62,34,0.44), 0 0 60px -22px var(--glow);
    overflow: hidden;
    opacity: 0; transform: translateY(22px) scale(0.976);
    transition: opacity .46s var(--ease), transform .52s var(--ease);
  }
  .sheet-wrap.on .sheet { opacity: 1; transform: none; }

  .sheet-top {
    flex: 0 0 auto;
    display: flex; align-items: flex-start; gap: 16px;
    padding: clamp(20px, 3vw, 30px) clamp(20px, 3.4vw, 34px) 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,245,226,0.9), rgba(255,253,247,0));
  }
  .sheet-kicker {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 7px;
  }
  .sheet-title {
    margin: 0; font-size: clamp(1.45rem, 3.6vw, 2.1rem);
    font-weight: 700; letter-spacing: -0.02em; line-height: 1.08;
    background: linear-gradient(96deg, var(--accent), var(--accent-3) 52%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .sheet-x {
    margin-left: auto; flex: 0 0 auto;
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line-2);
    color: var(--ink-soft);
    transition: color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease), background .3s var(--ease);
  }
  .sheet-x svg { width: 17px; height: 17px; }
  .sheet-x:hover {
    color: var(--accent); border-color: rgba(168,80,31,0.45);
    background: rgba(255,240,220,0.9); transform: rotate(90deg);
  }

  .sheet-body {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: clamp(20px, 3vw, 30px) clamp(20px, 3.4vw, 34px) clamp(26px, 4vw, 38px);
    scrollbar-width: thin;
    scrollbar-color: rgba(168,80,31,0.4) transparent;
  }
  .sheet-body::-webkit-scrollbar { width: 9px; }
  .sheet-body::-webkit-scrollbar-track { background: transparent; }
  .sheet-body::-webkit-scrollbar-thumb {
    background: rgba(168,80,31,0.32); border-radius: 99px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  .sheet-body::-webkit-scrollbar-thumb:hover { background: rgba(168,80,31,0.5); background-clip: padding-box; }

  .sheet-body p { margin: 0 0 15px; color: var(--ink-soft); line-height: 1.72; font-size: 16px; max-width: 68ch; }
  .sheet-body p:last-child { margin-bottom: 0; }
  .sheet-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(168,80,31,0.35); transition: border-color .3s var(--ease); }
  .sheet-body a:hover { border-bottom-color: var(--accent); }
  .sheet-body strong { color: var(--ink); font-weight: 500; }

  .lbl {
    display: flex; align-items: center; gap: 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim); margin: 30px 0 15px;
  }
  .lbl:first-child { margin-top: 0; }
  .lbl::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line); }

  /* Entry list (Experience) */
  .entry {
    padding: 18px 0 20px;
    border-top: 1px solid var(--line);
  }
  .entry:first-of-type { border-top: 0; padding-top: 4px; }
  .entry-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .entry-n {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.16em; color: var(--accent-2);
  }
  .entry h3 { margin: 0; font-size: 17.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .entry h3 a { color: inherit; border-bottom-color: rgba(168,80,31,0.3); }
  .entry h3 a:hover { color: var(--accent); }
  .entry-org {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 9px;
  }
  .entry p { font-size: 15.2px; margin: 0 0 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.07em;
    padding: 4.5px 9px; border-radius: 6px;
    background: rgba(255,240,218,0.8);
    border: 1px solid rgba(168,80,31,0.16);
    color: var(--ink-soft);
  }

  /* Skills grid */
  .sk-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 22px 26px; }
  .sk-h {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--accent); padding-top: 11px; border-top: 1px solid var(--line);
    margin-bottom: 10px;
  }

  /* Resume block */
  .res-doc {
    background: #fff; border: 1px solid var(--line-2); border-radius: 12px;
    padding: 12px; box-shadow: 0 14px 34px -18px rgba(120,78,44,0.3);
  }
  .res-doc img { width: 100%; height: auto; display: block; border-radius: 7px; border: 1px solid var(--line); }
  .res-ph {
    aspect-ratio: 8.5 / 11; border: 1px dashed var(--line-2); border-radius: 7px;
    background: rgba(255,244,224,0.7);
    display: grid; place-content: center; gap: 8px; text-align: center; padding: 26px;
  }
  .res-ph .m {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim);
  }
  .dl {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 18px; padding: 12px 22px; border-radius: 999px;
    font-size: 14.5px; font-weight: 500; text-decoration: none;
    color: var(--accent); background: rgba(255,241,220,0.9);
    border: 1px solid rgba(168,80,31,0.4);
    transition: background .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .dl:hover {
    background: rgba(255,232,201,1); transform: translateY(-2px);
    box-shadow: 0 14px 30px -14px var(--glow);
  }
  .dl svg { width: 16px; height: 16px; transition: transform .35s var(--ease); }
  .dl:hover svg { transform: translateY(2px); }
  .dl .tag { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.1em; opacity: 0.7; }

  /* Figures inside panels */
  .figs {
    display: grid; gap: 14px; margin: 4px 0 20px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  }
  .figs.one { grid-template-columns: minmax(0, 1fr); max-width: 560px; }
  .fig { margin: 0; }
  .fig-box {
    position: relative; aspect-ratio: 4 / 3; overflow: hidden;
    border-radius: 11px; border: 1px solid var(--line);
    background: rgba(255,243,222,0.9);
    display: grid; place-items: center;
    box-shadow: 0 10px 26px -18px rgba(120,78,44,0.42);
    transition: border-color .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .fig-box img {
    position: absolute; inset: 0; z-index: 1;
    width: 100%; height: 100%; object-fit: cover; display: block;
    cursor: zoom-in;
    transition: transform .5s var(--ease), filter .35s var(--ease);
  }
  .fig-box:has(img):hover { border-color: rgba(168,80,31,0.42); transform: translateY(-2px); box-shadow: 0 18px 34px -18px rgba(120,78,44,0.5); }
  .fig-box:has(img):hover img { transform: scale(1.035); }
  .fig-box .m {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px; letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--ink-dim); text-align: center; padding: 10px; line-height: 1.6;
  }
  .fig figcaption {
    margin-top: 8px; font-size: 12.8px; color: var(--ink-dim); line-height: 1.55;
  }
  .zoom {
    position: absolute; right: 9px; bottom: 9px; z-index: 2;
    width: 26px; height: 26px; border-radius: 50%;
    display: none; place-items: center;
    background: rgba(255,250,240,0.9); border: 1px solid var(--line-2);
    color: var(--accent); pointer-events: none;
  }
  .fig-box:has(img) .zoom { display: grid; }
  .zoom svg { width: 13px; height: 13px; }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 90;
    display: grid; place-items: center; padding: clamp(16px, 4vw, 54px);
    background: rgba(58,36,18,0.62);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    opacity: 0; transition: opacity .32s var(--ease);
  }
  .lb[hidden] { display: none; }
  .lb.on { opacity: 1; }
  .lb-in { max-width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .lb img {
    max-width: 100%; max-height: 80vh; display: block;
    border-radius: 12px; border: 1px solid rgba(255,247,232,0.55);
    box-shadow: 0 40px 90px -30px rgba(48,28,12,0.7);
    transform: scale(0.965); transition: transform .34s var(--ease);
  }
  .lb.on img { transform: scale(1); }
  .lb-cap {

  function measure() {

    });

    layout();
  }

  /* ---------------- Layout ---------------- */
  function layout() {
    ring.style.transform = 'translateZ(-' + radius + 'px) rotateY(' + rotation + 'deg)';

    var frontIndex = ((Math.round(-rotation / step) % CARDS.length) + CARDS.length) % CARDS.length;

    faces.forEach(function (slot, i) {
      var angle = i * step;
      slot.style.transform = 'rotateY(' + angle + 'deg) translateZ(' + radius + 'px)';

      /* angular distance from facing the viewer */
      var rel = (angle + rotation) % 360;
      if (rel < 0) rel += 360;
      var off = rel > 180 ? 360 - rel : rel;

      slot.style.opacity = Math.max(0.16, 1 - (off / 180) * 1.15).toFixed(3);
      slot.style.zIndex = String(Math.round(1000 - off));

      var isFront = i === frontIndex;
      slot.classList.toggle('front', isFront);
      slot.setAttribute('aria-hidden', off > 90 ? 'true' : 'false');
    });

    for (var k = 0; k < pips.length; k++) {
      var on = k === frontIndex;
      pips[k].classList.toggle('on', on);
      pips[k].setAttribute('aria-selected', on ? 'true' : 'false');
    }
  }

  /* ---------------- Navigation ---------------- */
  function nudge(dir) {
    target = Math.round(target / step) * step - dir * step;
    idleAt = Date.now() + AUTO_DELAY;
  }

  function goTo(i) {
    var current = -target / step;
    var laps = Math.round((current - i) / CARDS.length);
    target = -(i + laps * CARDS.length) * step;
    idleAt = Date.now() + AUTO_DELAY;
  }

  prevBtn.addEventListener('click', function () { nudge(-1); });
  nextBtn.addEventListener('click', function () { nudge(1); });

  stage.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(1); }
  });

  /* ---------------- Drag / swipe ---------------- */
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    pointerId = e.pointerId;
    dragStartX = e.clientX;
    dragStartRot = target;
    dragMoved = 0;
    lastMoveX = e.clientX;
    lastMoveT = e.timeStamp || Date.now();
    velocity = 0;
    stage.classList.add('dragging');

    /* Remember the pressed card so a tap can be resolved on pointerup.
       NOTE: do NOT call setPointerCapture here — capturing on the stage
       retargets the click event away from the card button, which makes
       the cards unclickable. Window-level move/up listeners cover the
       case of the pointer leaving the stage mid-drag. */
    var t = e.target;
    pressFace = (t && t.closest) ? t.closest('.card-face') : null;
  });

  window.addEventListener('pointermove', function (e) {
    if (!dragging || (pointerId !== null && e.pointerId !== pointerId)) return;
    var dx = e.clientX - dragStartX;
    dragMoved = Math.max(dragMoved, Math.abs(dx));

    var box = stage.getBoundingClientRect();
    var perPx = 150 / Math.max(240, box.width * 0.55);
    target = dragStartRot + dx * perPx;

    var t = e.timeStamp || Date.now();
    var dt = t - lastMoveT;
    if (dt > 0) velocity = ((e.clientX - lastMoveX) * perPx) / dt;
    lastMoveX = e.clientX;
    lastMoveT = t;

    idleAt = Date.now() + AUTO_DELAY;
  });

  function frontIndex() {
    return ((Math.round(-rotation / step) % CARDS.length) + CARDS.length) % CARDS.length;
  }

  /* Front card opens; any other card rotates to the front first. */
  function activate(i) {
    if (i !== frontIndex()) { goTo(i); return; }
    openSheet(i);
  }

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    pointerId = null;
    stage.classList.remove('dragging');

    var tapped = pressFace;
    pressFace = null;

    /* A press that barely moved is a tap, not a drag. Snap from `rotation`
       (what the user actually sees) rather than the eased `target`, so a tap
       during auto-drift resolves to the card that looks front. */
    if (tapped && dragMoved <= 6) {
      target = Math.round(rotation / step) * step;
      velocity = 0;
      idleAt = Date.now() + AUTO_DELAY;
      var idx = parseInt(tapped.dataset.idx, 10);
      if (!isNaN(idx)) activate(idx);
      return;
    }

    /* carry a little momentum, then snap to nearest card */
    var flung = target + velocity * 130;
    target = Math.round(flung / step) * step;
    velocity = 0;
    idleAt = Date.now() + AUTO_DELAY;
  }

  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  stage.addEventListener('dragstart', function (e) { e.preventDefault(); });

  /* Wheel: horizontal or shift+vertical spins the ring */
  stage.addEventListener('wheel', function (e) {
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0);
    if (!d) return;
    e.preventDefault();
    target += d * 0.22;
    idleAt = Date.now() + AUTO_DELAY;
  }, { passive: false });

  /* ---------------- Sheet ---------------- */
  var sheetWrap = document.getElementById('sheetWrap');
  var sheetScrim = document.getElementById('sheetScrim');
  var sheetTitle = document.getElementById('sheetTitle');
  var sheetKicker = document.getElementById('sheetKicker');
  var sheetBody = document.getElementById('sheetBody');
  var sheetX = document.getElementById('sheetX');
  var sheetPrev = document.getElementById('sheetPrev');
  var sheetNext = document.getElementById('sheetNext');
  var sheetDots = document.getElementById('sheetDots');

  var sheetOpen = false;
  var sheetIndex = 0;
  var lastFocus = null;
  var closeTimer = null;

  CARDS.forEach(function (c, i) {
    var d = document.createElement('button');
    d.type = 'button';
    d.className = 'sdot';
    d.setAttribute('aria-label', c.title);
    d.addEventListener('click', function () { showSheet(i); });
    sheetDots.appendChild(d);
  });
  var sdots = sheetDots.querySelectorAll('.sdot');

  function showSheet(i) {
    sheetIndex = ((i % CARDS.length) + CARDS.length) % CARDS.length;
    var c = CARDS[sheetIndex];
    sheetTitle.textContent = c.title;
    sheetKicker.textContent = '0' + (sheetIndex + 1) + ' / 0' + CARDS.length;
    sheetBody.innerHTML = c.body || '';
    sheetBody.scrollTop = 0;
    for (var k = 0; k < sdots.length; k++) {
      sdots[k].classList.toggle('on', k === sheetIndex);
    }
    goTo(sheetIndex);
  }

  function openSheet(i) {
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    lastFocus = document.activeElement;
    sheetWrap.hidden = false;
    showSheet(i);
    document.body.classList.add('locked');
    requestAnimationFrame(function () {
      sheetWrap.classList.add('on');
      sheetOpen = true;
      sheetBody.focus({ preventScroll: true });
    });
  }

  function closeSheet() {
    if (!sheetOpen) return;
    if (lbOpen) closeLb();
    sheetOpen = false;
    sheetWrap.classList.remove('on');
    document.body.classList.remove('locked');
    closeTimer = setTimeout(function () {
      sheetWrap.hidden = true;
      closeTimer = null;
    }, reduce ? 0 : 460);
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (err) {} }
    idleAt = Date.now() + AUTO_DELAY;
  }

  sheetX.addEventListener('click', closeSheet);
  sheetScrim.addEventListener('click', closeSheet);
  sheetPrev.addEventListener('click', function () { showSheet(sheetIndex - 1); });
  sheetNext.addEventListener('click', function () { showSheet(sheetIndex + 1); });

  /* ---------------- Lightbox ---------------- */
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var lbX = document.getElementById('lbX');
  var lbOpen = false, lbTimer = null, lbLastFocus = null;

  function openLb(src, cap) {
    if (lbTimer) { clearTimeout(lbTimer); lbTimer = null; }
    lbLastFocus = document.activeElement;
    lbImg.src = src;
    lbImg.alt = cap || '';
    lbCap.textContent = cap || '';
    lb.hidden = false;
    requestAnimationFrame(function () {
      lb.classList.add('on');
      lbOpen = true;
      lbX.focus({ preventScroll: true });
    });
  }

  function closeLb() {
    if (!lbOpen) return;
    lbOpen = false;
    lb.classList.remove('on');
    lbTimer = setTimeout(function () {
      lb.hidden = true;
      lbImg.src = '';
      lbTimer = null;
    }, reduce ? 0 : 340);
    if (lbLastFocus && lbLastFocus.focus) { try { lbLastFocus.focus({ preventScroll: true }); } catch (err) {} }
  }

  /* Any figure image inside a panel opens full size */
  sheetBody.addEventListener('click', function (e) {
    var img = e.target.closest ? e.target.closest('.fig-box img') : null;
    if (!img) return;
    openLb(img.getAttribute('src'), img.getAttribute('data-cap') || '');
  });

  lbX.addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target.className === 'lb-in') closeLb(); });

  document.addEventListener('keydown', function (e) {
    if (!lbOpen) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLb(); }
    else if (e.key === 'Tab') { e.preventDefault(); lbX.focus(); }
  }, true);

  document.addEventListener('keydown', function (e) {
    if (!sheetOpen || lbOpen) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); showSheet(sheetIndex - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); showSheet(sheetIndex + 1); }
    else if (e.key === 'Tab') {
      /* keep focus inside the dialog */
      var f = sheetWrap.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* Horizontal swipe inside the sheet steps between cards; vertical scrolls */
  var swX = 0, swY = 0, swT = 0;
  sheetWrap.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    swX = e.touches[0].clientX; swY = e.touches[0].clientY; swT = Date.now();
  }, { passive: true });
  sheetWrap.addEventListener('touchend', function (e) {
    if (!e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - swX;
    var dy = e.changedTouches[0].clientY - swY;
    if (Date.now() - swT > 700) return;
    if (Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.7) {
      showSheet(sheetIndex + (dx < 0 ? 1 : -1));
    }
  }, { passive: true });

  /* ---------------- Render loop ---------------- */
  function frame() {
    if (!dragging && !reduce && !sheetOpen && Date.now() > idleAt) {
      target += AUTO_SPEED;
    }
    rotation += (target - rotation) * (dragging ? 0.34 : 0.10);
    if (Math.abs(target - rotation) < 0.0008) rotation = target;
    layout();
    requestAnimationFrame(frame);
  }

  /* ---------------- Boot ---------------- */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(measure, 90);
  }, { passive: true });

  measure();
  requestAnimationFrame(function () {
    document.body.classList.add('ready');
    measure();
    frame();
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(measure).catch(function () {});
  }
})();
</script>

</body>
</html>
