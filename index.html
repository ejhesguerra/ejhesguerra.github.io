<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e4eef9">
<title>Elvin's Portfolio</title>
<meta name="description" content="Elvin Esguerra — portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e4eef9;
    --bg-2: #f2f8fd;
    --bg-deep: #cfe0f2;
    --shadow: rgba(28,56,92,0.16);
    --ink: #23303f;
    --ink-soft: #40536b;
    --ink-dim: #4e6076;
    --line: rgba(40,72,112,0.14);
    --line-2: rgba(40,72,112,0.26);
    --accent: #1a5c93;
    --accent-2: #3f8cc4;
    --accent-3: #26719f;

    /* Background scenery — swap the url to change the photo.
       Options shipped: bg-fuji.jpg, bg-fuji-lake.jpg, bg-mountains.jpg, bg-sky.jpg, bg-dunes.jpg
       Or drop in your own file and point this at it. */
    --scenery: url("bg-fuji.jpg");
    --scenery-strength: 0.22;
    --card-bg: rgba(252,254,255,0.80);
    --accent-rgb: 26,92,147;
    --line-rgb: 40,72,112;
    --glow: rgba(26,92,147,0.28);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* ---- Per-card themes. The whole page fades into the front card's color. ---- */
  html[data-theme="about"] {
    --bg:#e4eef9; --bg-2:#f2f8fd; --bg-deep:#cfe0f2;
    --ink:#23303f; --ink-soft:#40536b; --ink-dim:#4e6076;
    --line:rgba(var(--line-rgb), 0.14); --line-2:rgba(var(--line-rgb), 0.26);
    --accent:#1a5c93; --accent-2:#3f8cc4; --accent-3:#26719f;
    --accent-rgb:26,92,147; --line-rgb:40,72,112;
    --glow:rgba(var(--accent-rgb), 0.28);
    --shadow:rgba(28,56,92,0.16);
  }
  html[data-theme="exp"] {
    --bg:#e3f2e8; --bg-2:#f1faf3; --bg-deep:#cee6d6;
    --ink:#1f3528; --ink-soft:#3a5844; --ink-dim:#476552;
    --line:rgba(28,84,52,0.15); --line-2:rgba(28,84,52,0.28);
    --accent:#1c6b41; --accent-2:#3f9c68; --accent-3:#247d4d;
    --accent-rgb:28,107,65; --line-rgb:28,84,52;
    --glow:rgba(28,107,65,0.26);
    --shadow:rgba(26,66,44,0.16);
  }
  html[data-theme="resume"] {
    --bg:#ebe9f9; --bg-2:#f5f3fd; --bg-deep:#dad5f0;
    --ink:#2b2740; --ink-soft:#4a4468; --ink-dim:#575074;
    --line:rgba(64,52,124,0.15); --line-2:rgba(64,52,124,0.28);
    --accent:#4a3b96; --accent-2:#7a68c4; --accent-3:#5a49a8;
    --accent-rgb:74,59,150; --line-rgb:64,52,124;
    --glow:rgba(74,59,150,0.26);
    --shadow:rgba(52,42,96,0.16);
  }
  html[data-theme="pets"] {
    --bg:#fbeedb; --bg-2:#fef8ef; --bg-deep:#f2ddc0;
    --ink:#3a2d1c; --ink-soft:#5c4830; --ink-dim:#6b5438;
    --line:rgba(120,80,28,0.16); --line-2:rgba(120,80,28,0.30);
    --accent:#8a4f12; --accent-2:#c4813a; --accent-3:#9d5c18;
    --accent-rgb:138,79,18; --line-rgb:120,80,28;
    --glow:rgba(138,79,18,0.26);
    --shadow:rgba(96,64,28,0.16);
  }


  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    transition: background-color 1.05s var(--ease), color 1.05s var(--ease);
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Ambient backdrop — scenic photo + cream scrim + warm washes */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1200px 680px at 20% 6%, var(--glow), transparent 64%),
      radial-gradient(1000px 620px at 84% 94%, var(--glow), transparent 66%),
      radial-gradient(760px 520px at 92% 12%, var(--bg-2), transparent 62%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 52%, var(--bg-deep) 100%);
    transition: background 1.05s var(--ease);
  }
  /* Photo layer: swap --scenery to change the image */
  .backdrop::before {
    content: ""; position: absolute; inset: 0;
    background-image: var(--scenery, url("bg-fuji.jpg"));
    background-size: cover;
    background-position: center 58%;
    background-repeat: no-repeat;
    opacity: var(--scenery-strength, 0.18);
    filter: saturate(0.90) contrast(0.96);
    transform: scale(1.04);
    animation: driftBg 46s ease-in-out infinite alternate;
    transition: opacity 1.05s var(--ease);
  }
  @keyframes driftBg {
    0%   { transform: scale(1.04) translate3d(0, 0, 0); }
    100% { transform: scale(1.09) translate3d(-1.2%, -1.4%, 0); }
  }
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, rgba(255,255,255,0.85), transparent 62%),
      radial-gradient(1.3px 1.3px at 34% 62%, rgba(228,242,255,0.70), transparent 62%),
      radial-gradient(1.8px 1.8px at 58% 26%, rgba(255,255,255,0.78), transparent 62%),
      radial-gradient(1.3px 1.3px at 76% 71%, rgba(220,238,255,0.62), transparent 62%),
      radial-gradient(1.7px 1.7px at 89% 34%, rgba(255,255,255,0.72), transparent 62%),
      radial-gradient(1.2px 1.2px at 47% 86%, rgba(216,236,255,0.58), transparent 62%),
      radial-gradient(1.5px 1.5px at 7% 74%, rgba(255,255,255,0.55), transparent 62%),
      radial-gradient(1.3px 1.3px at 66% 9%, rgba(230,244,255,0.60), transparent 62%);
    background-repeat: repeat;
    background-size: 620px 480px;
    opacity: .34;
    animation: twinkle 9s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .24; } 50% { opacity: .44; } }

  /* Shell */
  .stage-wrap {
    position: relative; z-index: 1;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 22px 20px 26px;
    gap: clamp(10px, 2.2vh, 26px);
  }

  /* Title */
  .masthead { text-align: center; flex: 0 0 auto; }
  .masthead h1 {
    margin: 0;
    font-size: clamp(2rem, 6.2vw, 4.4rem);
    line-height: 0.98;
    font-weight: 300;
    letter-spacing: -0.035em;
  }
  .masthead h1 .strong {
    display: block;
    font-weight: 700;
    background: linear-gradient(96deg, var(--accent), var(--accent-3) 46%, var(--accent-2) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .masthead .sub {
    margin: clamp(8px, 1.4vh, 16px) 0 0;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(10px, 1.15vw, 12.5px);
    letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--ink-dim);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .masthead .sub .glyph {
    display: inline-block; width: 18px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }
  .masthead .sub .glyph.r {
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  /* Ring stage */
  .stage {
    flex: 1 1 auto;
    width: 100%;
    max-width: 1240px;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 2000px;
    touch-action: pan-y;
    cursor: grab;
    outline: none;
  }
  .stage.dragging { cursor: grabbing; }
  .stage:focus-visible { outline: none; }
  .stage:focus-visible .ring3d { filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }

  .ring3d {
    position: relative;
    width: 1px; height: 1px;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .card3d {
    position: absolute; left: 0; top: 0;
    transform-style: preserve-3d;
    will-change: transform, opacity;
  }

  .card-face {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--card-bg);
    backdrop-filter: blur(10px) saturate(130%);
    -webkit-backdrop-filter: blur(10px) saturate(130%);
    box-shadow: 0 20px 46px -22px rgba(44,78,122,0.30), 0 2px 8px -3px rgba(44,78,122,0.14);
    display: flex; flex-direction: column; justify-content: flex-end;
    text-decoration: none; color: inherit;
    transition: border-color .5s var(--ease), box-shadow .5s var(--ease);
  }
  .card3d.front .card-face {
    border-color: rgba(var(--accent-rgb), 0.40);
    box-shadow: 0 28px 62px -24px rgba(44,78,122,0.34), 0 0 44px -14px var(--glow);
  }

  /* Faded imagery layer */
  .card-art {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: saturate(0.72) contrast(1.02);
    opacity: .30;
    transform: scale(1.02);
    transition: opacity .6s var(--ease), transform .8s var(--ease), filter .6s var(--ease);
  }
  .card3d.front .card-art { opacity: .40; filter: saturate(0.95); transform: scale(1.06); }

  .card-art.gen-exp {
    background-image:
      radial-gradient(circle at 30% 22%, rgba(63,156,104,0.55), transparent 56%),
      radial-gradient(circle at 74% 78%, rgba(140,206,168,0.52), transparent 58%),
      repeating-linear-gradient(90deg, rgba(28,84,52,0.07) 0 1px, transparent 1px 7px),
      linear-gradient(160deg, #dcf2e4, #b8ddc7);
  }
  .card-art.gen-pets {
    background-image:
      radial-gradient(circle at 68% 26%, rgba(196,129,58,0.55), transparent 56%),
      radial-gradient(circle at 24% 80%, rgba(222,168,98,0.48), transparent 58%),
      repeating-linear-gradient(48deg, rgba(120,80,28,0.07) 0 1px, transparent 1px 9px),
      linear-gradient(160deg, #fdf0dc, #f2d8b4);
  }

  .card-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(252,254,255,0.96) 0%, rgba(250,253,255,0.80) 36%, rgba(250,253,255,0.24) 74%, transparent 100%);
  }
  .card-hair {
    position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.60), transparent);
    opacity: 0; transition: opacity .5s var(--ease);
  }
  .card3d.front .card-hair { opacity: 1; }

  .card-body {
    position: relative;
    padding: var(--pad, 20px);
    display: flex; flex-direction: column; gap: 6px;
  }
  .card-num {
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: var(--fs-num, 10px);
    letter-spacing: 0.24em;
    color: var(--accent);
    opacity: .85;
  }
  .card-title {
    margin: 0;
    font-size: var(--fs-title, 22px);
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .card-note {
    margin: 0;
    font-size: var(--fs-note, 13px);
    line-height: 1.45;
    color: var(--ink-soft);
  }

  /* Controls */
  .controls {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    gap: 18px;
  }
  .navbtn {
    width: 40px; height: 40px; flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line-2);
    background: rgba(255,255,255,0.62);
    color: var(--ink-soft);
    cursor: pointer;
    transition: color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease), transform .3s var(--ease);
  }
  .navbtn svg { width: 16px; height: 16px; }
  .navbtn:hover {
    color: var(--accent); border-color: rgba(var(--accent-rgb), 0.45);
    background: rgba(var(--accent-rgb), 0.09); transform: translateY(-1px);
  }
  .navbtn:active { transform: translateY(0) scale(0.96); }

  .pips { display: flex; align-items: center; gap: 9px; }
  .pip {
    width: 7px; height: 7px; padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line-2);
    background: transparent;
    cursor: pointer;
    transition: background .35s var(--ease), border-color .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .pip:hover { border-color: var(--accent); transform: scale(1.2); }
  .pip.on {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.15);
    transform: scale(1.15);
  }

  .navbtn:focus-visible, .pip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }

  /* Entrance */
  .fade { opacity: 0; transform: translateY(14px); }
  body.ready .fade {
    opacity: 1; transform: none;
    transition: opacity .9s var(--ease), transform .9s var(--ease);
  }
  body.ready .f1 { transition-delay: .05s; }
  body.ready .f2 { transition-delay: .16s; }
  body.ready .f3 { transition-delay: .30s; }

  @media (max-width: 640px) {
    .stage-wrap { padding: 18px 14px 20px; }
    .masthead .sub { letter-spacing: 0.24em; }
    .controls { gap: 14px; }
    .navbtn { width: 36px; height: 36px; }
  }


  /* ---------------- Clickable card face ---------------- */
  .card-face {
    appearance: none; -webkit-appearance: none;
    font: inherit; color: inherit; text-align: left;
    padding: 0; margin: 0; cursor: pointer;
  }
  .card3d:not(.front) .card-face { cursor: grab; }
  .card-face:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 4px;
  }
  .card-cta {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: calc(var(--pad, 20px) * 0.55);
    font-family: "JetBrains Mono", monospace;
    font-size: var(--fs-num, 10px);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
    opacity: 0; transform: translateY(4px);
    transition: opacity .5s var(--ease), transform .5s var(--ease), gap .3s var(--ease);
  }
  .card3d.front .card-cta { opacity: 1; transform: none; }
  .card-face:hover .card-cta { gap: 12px; }
  .card-cta svg { width: 1.05em; height: 1.05em; }

  /* ---------------- Sheet ---------------- */
  .sheet-wrap {
    position: fixed; inset: 0; z-index: 90;
    display: grid; place-items: center;
    padding: clamp(12px, 3vw, 40px);
  }
  .sheet-wrap[hidden] { display: none; }
  body.locked .stage-wrap { pointer-events: none; }

  .sheet-scrim {
    position: absolute; inset: 0;
    background: rgba(34,60,96,0.42);
    backdrop-filter: blur(7px) saturate(120%);
    -webkit-backdrop-filter: blur(7px) saturate(120%);
    opacity: 0; transition: opacity .42s var(--ease);
  }
  .sheet-wrap.on .sheet-scrim { opacity: 1; }

  .sheet {
    position: relative;
    width: min(860px, 100%);
    max-height: min(88vh, 860px);
    display: flex; flex-direction: column;
    background: linear-gradient(178deg, #fcfeff 0%, #f2f8fd 100%);
    border: 1px solid var(--line-2);
    border-radius: 20px;
    box-shadow: 0 44px 96px -34px rgba(34,64,104,0.44), 0 0 60px -22px var(--glow);
    overflow: hidden;
    opacity: 0; transform: translateY(22px) scale(0.976);
    transition: opacity .46s var(--ease), transform .52s var(--ease);
  }
  .sheet-wrap.on .sheet { opacity: 1; transform: none; }

  .sheet-top {
    flex: 0 0 auto;
    display: flex; align-items: flex-start; gap: 16px;
    padding: clamp(20px, 3vw, 30px) clamp(20px, 3.4vw, 34px) 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(238,246,254,0.9), rgba(252,254,255,0));
  }
  .sheet-kicker {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 7px;
  }
  .sheet-title {
    margin: 0; font-size: clamp(1.45rem, 3.6vw, 2.1rem);
    font-weight: 700; letter-spacing: -0.02em; line-height: 1.08;
    background: linear-gradient(96deg, var(--accent), var(--accent-3) 52%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .sheet-x {
    margin-left: auto; flex: 0 0 auto;
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line-2);
    color: var(--ink-soft);
    transition: color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease), background .3s var(--ease);
  }
  .sheet-x svg { width: 17px; height: 17px; }
  .sheet-x:hover {
    color: var(--accent); border-color: rgba(var(--accent-rgb), 0.45);
    background: rgba(234,244,253,0.9); transform: rotate(90deg);
  }

  .sheet-body {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: clamp(20px, 3vw, 30px) clamp(20px, 3.4vw, 34px) clamp(26px, 4vw, 38px);
    scrollbar-width: thin;
    scrollbar-color: rgba(var(--accent-rgb), 0.4) transparent;
  }
  .sheet-body::-webkit-scrollbar { width: 9px; }
  .sheet-body::-webkit-scrollbar-track { background: transparent; }
  .sheet-body::-webkit-scrollbar-thumb {
    background: rgba(var(--accent-rgb), 0.32); border-radius: 99px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  .sheet-body::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), 0.5); background-clip: padding-box; }

  .sheet-body p { margin: 0 0 15px; color: var(--ink-soft); line-height: 1.72; font-size: 16px; max-width: 68ch; }
  .sheet-body p:last-child { margin-bottom: 0; }
  .sheet-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(var(--accent-rgb), 0.35); transition: border-color .3s var(--ease); }
  .sheet-body a:hover { border-bottom-color: var(--accent); }
  .sheet-body strong { color: var(--ink); font-weight: 500; }

  .lbl {
    display: flex; align-items: center; gap: 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim); margin: 30px 0 15px;
  }
  .lbl:first-child { margin-top: 0; }
  .lbl::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line); }

  /* Entry list (Experience) */
  .entry {
    padding: 18px 0 20px;
    border-top: 1px solid var(--line);
  }
  .entry:first-of-type { border-top: 0; padding-top: 4px; }
  .entry-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .entry-n {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.16em; color: var(--accent-2);
  }
  .entry h3 { margin: 0; font-size: 17.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .entry h3 a { color: inherit; border-bottom-color: rgba(var(--accent-rgb), 0.3); }
  .entry h3 a:hover { color: var(--accent); }
  .entry-org {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 9px;
  }
  .entry p { font-size: 15.2px; margin: 0 0 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.07em;
    padding: 4.5px 9px; border-radius: 6px;
    background: rgba(234,244,253,0.8);
    border: 1px solid rgba(var(--accent-rgb), 0.16);
    color: var(--ink-soft);
  }

  /* Project list (clickable rows) */
  .plist { display: flex; flex-direction: column; gap: 10px; }
  .prow {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto;
    align-items: center; gap: 14px;
    width: 100%; text-align: left;
    padding: 15px 16px;
    background: rgba(255,255,255,0.72);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: inherit; color: inherit; cursor: pointer;
    transition: border-color .3s var(--ease), background .3s var(--ease),
                transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .prow:hover, .prow:focus-visible {
    border-color: rgba(var(--accent-rgb), 0.42);
    background: rgba(255,255,255,0.94);
    transform: translateY(-2px);
    box-shadow: 0 12px 26px -16px rgba(44,78,122,0.34);
    outline: none;
  }
  .prow-n {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.14em; color: var(--accent-2);
  }

    else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (projIndex >= 0) showProj(projIndex - 1); else showSheet(sheetIndex - 1);
    }
    else if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (projIndex >= 0) showProj(projIndex + 1); else showSheet(sheetIndex + 1);
    }
    else if (e.key === 'Tab') {
      /* keep focus inside the dialog */
      var f = sheetWrap.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* Horizontal swipe inside the sheet steps between cards; vertical scrolls */
  var swX = 0, swY = 0, swT = 0;
  sheetWrap.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    swX = e.touches[0].clientX; swY = e.touches[0].clientY; swT = Date.now();
  }, { passive: true });
  sheetWrap.addEventListener('touchend', function (e) {
    if (!e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - swX;
    var dy = e.changedTouches[0].clientY - swY;
    if (Date.now() - swT > 700) return;
    if (Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.7) {
      var d = dx < 0 ? 1 : -1;
      if (projIndex >= 0) showProj(projIndex + d); else showSheet(sheetIndex + d);
    }
  }, { passive: true });

  /* ---------------- Render loop ---------------- */
  function frame() {
    if (!dragging && !reduce && !sheetOpen && Date.now() > idleAt) {
      target += AUTO_SPEED;
    }
    rotation += (target - rotation) * (dragging ? 0.34 : 0.10);
    if (Math.abs(target - rotation) < 0.0008) rotation = target;
    layout();
    requestAnimationFrame(frame);
  }

  /* ---------------- Boot ---------------- */
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(measure, 90);
  }, { passive: true });

  measure();
  requestAnimationFrame(function () {
    document.body.classList.add('ready');
    measure();
    frame();
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(measure).catch(function () {});
  }
})();
</script>

</body>
</html>
